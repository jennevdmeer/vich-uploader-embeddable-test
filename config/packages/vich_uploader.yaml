vich_uploader:
    db_driver: orm

    mappings:
        thumbnail:
            uri_prefix: /images/thumbnail
            upload_destination: '%kernel.project_dir%/public/images/thumbnail'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        large_rectangle:
            uri_prefix: /images/large_rectangle
            upload_destination: '%kernel.project_dir%/public/images/large_rectangle'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        large_skyscraper:
            uri_prefix: /images/large_skyscraper
            upload_destination: '%kernel.project_dir%/public/images/large_skyscraper'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
